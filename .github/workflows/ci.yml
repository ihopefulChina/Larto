name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS arm64 runner: the only supported target, and electron-vite/electron download arm64 binaries.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test (launch app, wait for guest, capture window)
        run: |
          pnpm exec electron . --smoke-test=/tmp/smoke.png
          test -s /tmp/smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: /tmp/smoke.png
          if-no-files-found: ignore
