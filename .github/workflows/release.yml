name: Release

# Push a tag `vX.Y.Z` (matching package.json "version") to build the arm64 DMG + ZIP and publish
# them, together with latest-mac.yml for electron-updater, to a GitHub Release.
# Signing / notarisation only happen when the corresponding secrets exist (see README "Release").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          [ "$PKG" = "$TAG" ] || { echo "package.json is $PKG but tag is $TAG"; exit 1; }
      - name: Build and publish (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Developer ID + notarisation. Missing secrets still inject "" into the
          # environment; electron-builder treats CSC_LINK="" as a file path (the repo root)
          # and fails with "not a file". Unset empties below so unsigned builds work.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          fi
          if [ -z "${APPLE_ID}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder --mac --arm64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
