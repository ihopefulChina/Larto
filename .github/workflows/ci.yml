name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LARTO_SMOKE_URL: data:text/html,%3Ctitle%3ELarto%20Smoke%3C%2Ftitle%3E

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            artifact: linux-x64
          - name: Windows x64
            runner: windows-latest
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Linux display dependencies
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          CHROME_SANDBOX=$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('electron/package.json')), 'dist/chrome-sandbox')")
          test -f "$CHROME_SANDBOX" && test ! -L "$CHROME_SANDBOX"
          CHROME_SANDBOX=$(realpath "$CHROME_SANDBOX")
          case "$CHROME_SANDBOX" in "$GITHUB_WORKSPACE"/*) ;; *) exit 1 ;; esac
          sudo chown root:root "$CHROME_SANDBOX"
          sudo chmod 4755 "$CHROME_SANDBOX"
          test "$(stat -c '%u:%g:%a' "$CHROME_SANDBOX")" = "0:0:4755"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          LARTO_USER_DATA: ${{ runner.temp }}/larto-smoke-profile
        run: |
          mkdir -p "$LARTO_USER_DATA"
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({mcp:{enabled:false},autoCheckUpdates:false,lastUrl:process.env.LARTO_SMOKE_URL}))" "$LARTO_USER_DATA/settings.json"
          pnpm exec electron . --smoke-test="$RUNNER_TEMP/smoke.png"
          test -s "$RUNNER_TEMP/smoke.png"
      - name: Smoke test (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push'
        env:
          LARTO_USER_DATA: ${{ runner.temp }}/larto-smoke-profile
        run: |
          mkdir -p "$LARTO_USER_DATA"
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({mcp:{enabled:false},autoCheckUpdates:false,lastUrl:process.env.LARTO_SMOKE_URL}))" "$LARTO_USER_DATA/settings.json"
          xvfb-run -a pnpm exec electron . --disable-gpu --smoke-test="$RUNNER_TEMP/smoke.png"
          test -s "$RUNNER_TEMP/smoke.png"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LARTO_USER_DATA: ${{ runner.temp }}\larto-smoke-profile
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke.png'
          New-Item -ItemType Directory -Path $env:LARTO_USER_DATA -Force | Out-Null
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({mcp:{enabled:false},autoCheckUpdates:false,lastUrl:process.env.LARTO_SMOKE_URL}))" (Join-Path $env:LARTO_USER_DATA 'settings.json')
          pnpm exec electron . "--smoke-test=$smoke"
          if (-not (Test-Path $smoke)) { throw "Smoke screenshot was not created at $smoke" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.artifact }}
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
          retention-days: 7
