# Cross-platform electron-builder configuration. Release CI builds macOS arm64/x64, Windows x64,
# and Linux x64 on their native runner families. Signing/notarization is driven by CI secrets:
#   CSC_LINK / CSC_KEY_PASSWORD          -> Developer ID Application certificate (.p12, base64)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID -> notarization
# Without them the bundle is ad-hoc signed by scripts/after-pack.mjs (Gatekeeper then shows the
# recoverable "unidentified developer" prompt instead of "damaged"). Windows artifacts remain
# unsigned until a Windows code-signing certificate is configured.
appId: app.ihopeful.FeishuDevTools
productName: FeishuDevTools
copyright: Copyright © 2026 ihopefulChina
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
compression: maximum
npmRebuild: false
afterPack: ./scripts/after-pack.mjs
electronLanguages:
  - zh_CN
  - en
mac:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '13.0'
  notarize: true
  extendInfo:
    NSCameraUsageDescription: FeishuDevTools 需要访问摄像头以调试使用相机的网页应用。
    NSMicrophoneUsageDescription: FeishuDevTools 需要访问麦克风以调试使用音频的网页应用。
    NSLocationWhenInUseUsageDescription: FeishuDevTools 需要位置信息以模拟 JSAPI 定位能力。
win:
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}
  requestExecutionLevel: user
linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  icon: build/icon.png
  category: Development
  maintainer: ihopefulChina <ihopefulChina@users.noreply.github.com>
  vendor: ihopefulChina
  synopsis: Feishu/Lark H5 debugger with device simulation, Chromium DevTools, and MCP
  description: Secure cross-platform desktop debugger for Feishu/Lark H5 applications.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]
appImage:
  artifactName: ${productName}-${version}-linux-x64.${ext}
  # electron-builder 26 otherwise writes `Exec=AppRun --no-sandbox %U`. The legacy AppRun may
  # still add the flag when user namespaces are unavailable, so main/index.ts also fails closed.
  executableArgs: []
deb:
  artifactName: ${productName}-${version}-linux-x64.${ext}
rpm:
  artifactName: ${productName}-${version}-linux-x64.${ext}
dmg:
  sign: false
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications
publish:
  provider: github
  owner: ihopefulChina
  repo: FeishuDevTools
  releaseType: release
